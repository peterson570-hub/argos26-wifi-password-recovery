          cat > app/src/main/java/br/com/argos26/wifipasswordrecovery/PasswordAnalyzer.kt <<'PROJ_EOF'
          package br.com.argos26.wifipasswordrecovery

          import kotlin.math.ln
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow

          /**
           * Análise 100% local da força de uma senha informada pelo proprietário.
           * A senha nunca é armazenada, registrada em log nem enviada pela rede.
           * Não existe nenhuma função para descobrir/adivinhar senhas de redes.
           */
          object PasswordAnalyzer {

              private val commonPasswords = setOf(
                  "12345678", "123456789", "1234567890", "12345678910", "87654321", "00000000",
                  "11111111", "123123123", "password", "password1", "senha123", "senha1234",
                  "senhawifi", "minhasenha", "meuwifi", "wifi1234", "brasil123", "qwerty123",
                  "admin123", "internet", "abcd1234", "mudar123", "1q2w3e4r", "iloveyou",
                  "qazwsxedc", "corinthians", "flamengo", "palmeiras", "visitante", "convidado"
              )
              private val commonWords = listOf(
                  "password", "senha", "brasil", "qwerty", "admin", "wifi", "internet",
                  "flamengo", "corinthians", "palmeiras", "mudar", "123456", "abcdef",
                  "iloveyou", "welcome", "letmein", "roteador", "router"
              )
              private val keyboardRuns = listOf("qwert", "asdfg", "zxcvb", "1q2w3e", "qazwsx", "poiuy")

              private fun normalizeLeet(s: String): String = s.lowercase()
                  .replace('0', 'o').replace('1', 'i').replace('3', 'e')
                  .replace('4', 'a').replace('5', 's').replace('7', 't')
                  .replace('@', 'a').replace('$', 's')

              fun analyze(pw: String): PasswordResult {
                  val issues = mutableListOf<String>()
                  val tips = mutableListOf<String>()
                  val len = pw.length
                  if (len == 0) {
                      return PasswordResult(0, 0, 0, "Vazia", RiskLevel.CRITICAL, "—", false,
                          listOf("Nenhuma senha informada."), listOf("Digite a senha para analisar."))
                  }

                  var pool = 0
                  if (pw.any { it in 'a'..'z' }) pool += 26
                  if (pw.any { it in 'A'..'Z' }) pool += 26
                  if (pw.any { it in '0'..'9' }) pool += 10
                  if (pw.any { it.code < 128 && !it.isLetterOrDigit() }) pool += 33
                  if (pw.any { it.code >= 128 }) pool += 64
                  if (pool == 0) pool = 10

                  val unique = pw.toSet().size
                  val effectiveLen = unique + (len - unique) * 0.25
                  var bits = effectiveLen * (ln(pool.toDouble()) / ln(2.0))

                  // Sequências crescentes/decrescentes (abc, 123, 321)
                  var seqRuns = 0
                  var i = 0
                  while (i < len - 2) {
                      val d1 = pw[i + 1].code - pw[i].code
                      val d2 = pw[i + 2].code - pw[i + 1].code
                      if ((d1 == 1 || d1 == -1) && d1 == d2) {
                          seqRuns++
                          var j = i + 2
                          while (j < len - 1 && pw[j + 1].code - pw[j].code == d1) j++
                          i = j
                      } else i++
                  }
                  if (seqRuns > 0) {
                      bits -= 6.0 * seqRuns
                      issues += "Contém sequências previsíveis (ex.: abc, 123)."
                  }

                  val lower = pw.lowercase()
                  if (keyboardRuns.any { lower.contains(it) }) {
                      bits -= 12
                      issues += "Contém padrão de teclado (ex.: qwerty, asdfg)."
                  }
                  if (Regex("^(.{1,4})\\1+$").containsMatchIn(pw)) {
                      bits *= 0.4
                      issues += "É formada por um bloco curto repetido."
                  }
                  if (unique < len * 0.6) issues += "Muitos caracteres repetidos."
                  if (Regex("(19|20)\\d{2}").containsMatchIn(pw)) {
                      bits -= 5
                      issues += "Contém um ano, muito comum em senhas."
                  }

                  val norm = normalizeLeet(pw)
                  val isCommon = lower in commonPasswords || norm in commonPasswords
                  if (isCommon) {
                      bits = min(bits, 10.0)
                      issues += "É uma senha extremamente comum e consta em listas conhecidas."
                  } else if (commonWords.any { norm.contains(it) }) {
                      bits -= 15
                      issues += "Contém palavra muito comum (mesmo com troca de letras por números/símbolos)."
                  }
                  if (pw.all { it.isDigit() }) issues += "Usa apenas números."
                  else if (pw.all { it.isLetter() }) issues += "Usa apenas letras."

                  bits = max(bits, 0.0)
                  val validForWpa = len in 8..63
                  if (len < 8) issues += "Menos de 8 caracteres: inválida para WPA2/WPA3 (mínimo 8)."
                  if (len > 63) issues += "Mais de 63 caracteres: inválida para WPA2/WPA3 (máximo 63)."
                  if (len in 8..11) issues += "Curta para uma rede Wi-Fi; prefira 16 caracteres ou mais."

                  val score = min(100, (bits / 80.0 * 100).toInt())
                  val (label, level) = when {
                      bits < 28 -> "Muito fraca" to RiskLevel.CRITICAL
                      bits < 40 -> "Fraca" to RiskLevel.HIGH
                      bits < 60 -> "Razoável" to RiskLevel.MEDIUM
                      bits < 80 -> "Boa" to RiskLevel.LOW
                      else -> "Forte" to RiskLevel.LOW
                  }

                  tips += "Use uma frase-senha de 4+ palavras não relacionadas (16+ caracteres)."
                  tips += "Evite dados pessoais, datas, nome da rede ou do provedor."
                  tips += "Use uma senha única para o Wi-Fi, diferente de outras contas."
                  tips += "Troque a senha padrão do roteador e a senha de administração dele."
                  if (level == RiskLevel.CRITICAL || level == RiskLevel.HIGH) {
                      tips += "Troque esta senha o quanto antes."
                  }

                  return PasswordResult(len, bits.toInt(), score, label, level, formatCrackTime(bits),
                      validForWpa, issues, tips)
              }

              /** Estimativa teórica e conservadora: 1 bilhão de tentativas/s, metade do espaço. */
              private fun formatCrackTime(bits: Double): String {
                  val seconds = 2.0.pow(max(bits - 1, 0.0)) / 1e9
                  return when {
                      seconds < 1 -> "menos de 1 segundo"
                      seconds < 60 -> "${seconds.toInt()} segundos"
                      seconds < 3600 -> "${(seconds / 60).toInt()} minutos"
                      seconds < 86400 -> "${(seconds / 3600).toInt()} horas"
                      seconds < 86400 * 365 -> "${(seconds / 86400).toInt()} dias"
                      seconds < 86400.0 * 365 * 1e9 -> {
                          val years = seconds / (86400.0 * 365)
                          if (years < 1e6) "${years.toLong()} anos" else "milhões de anos"
                      }
                      else -> "mais de 1 bilhão de anos"
                  }
              }
          }
