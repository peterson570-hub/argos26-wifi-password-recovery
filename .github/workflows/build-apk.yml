          cat > app/src/main/java/br/com/argos26/wifipasswordrecovery/SecurityAnalyzer.kt <<'PROJ_EOF'
          package br.com.argos26.wifipasswordrecovery

          import kotlin.math.abs

          /**
           * Avaliação PASSIVA: usa apenas o que a rede já anuncia nos beacons
           * (capabilities, frequência, sinal). Nenhuma conexão, injeção de pacotes,
           * captura de handshake ou tentativa de autenticação é realizada.
           */
          object SecurityAnalyzer {

              fun channelOf(freq: Int): Int = when (freq) {
                  in 2412..2472 -> (freq - 2407) / 5
                  2484 -> 14
                  in 5160..5895 -> (freq - 5000) / 5
                  in 5955..7115 -> (freq - 5950) / 5
                  else -> -1
              }

              fun bandOf(freq: Int): String = when (freq) {
                  in 2400..2500 -> "2,4 GHz"
                  in 5150..5895 -> "5 GHz"
                  in 5925..7125 -> "6 GHz"
                  else -> "?"
              }

              fun parseSecurity(capabilities: String): SecurityProfile {
                  val tokens = Regex("\\[([^\\]]*)\\]").findAll(capabilities)
                      .map { it.groupValues[1].uppercase() }.toList()

                  val wep = tokens.any { it.startsWith("WEP") }
                  val wpa1 = tokens.any { it.startsWith("WPA-") || it == "WPA" }
                  val legacyWpa2 = tokens.any {
                      it.startsWith("WPA2-") ||
                          (it.startsWith("RSN-") && (it.contains("PSK") || it.contains("EAP")))
                  }
                  val sae = tokens.any { it.contains("SAE") }
                  val owe = tokens.any { it.contains("OWE") }
                  val eap = tokens.any { it.contains("EAP") }
                  val tkip = tokens.any { it.contains("TKIP") }
                  val wps = tokens.any { it == "WPS" }

                  val kind = when {
                      sae && legacyWpa2 -> SecurityKind.WPA2_WPA3
                      sae -> SecurityKind.WPA3
                      wpa1 && legacyWpa2 -> SecurityKind.WPA_WPA2
                      wpa1 -> SecurityKind.WPA
                      legacyWpa2 -> SecurityKind.WPA2
                      owe -> SecurityKind.OWE
                      wep -> SecurityKind.WEP
                      else -> SecurityKind.OPEN
                  }
                  val base = when (kind) {
                      SecurityKind.OPEN -> "Aberta (sem criptografia)"
                      SecurityKind.OWE -> "Aberta com OWE"
                      SecurityKind.WEP -> "WEP"
                      SecurityKind.WPA -> "WPA"
                      SecurityKind.WPA_WPA2 -> "WPA/WPA2"
                      SecurityKind.WPA2 -> "WPA2"
                      SecurityKind.WPA2_WPA3 -> "WPA2/WPA3"
                      SecurityKind.WPA3 -> "WPA3"
                      SecurityKind.UNKNOWN -> "Não identificada"
                  }
                  val enterprise = eap && kind != SecurityKind.OPEN
                  val label = if (enterprise) "$base Enterprise" else base
                  return SecurityProfile(kind, enterprise, tkip, wps && !enterprise, label)
              }

              fun audit(entries: List<ScanEntry>): List<AuditedNetwork> {
                  val sorted = entries.sortedByDescending { it.levelDbm }
                  val profiles = sorted.map { parseSecurity(it.capabilities) }

                  return sorted.mapIndexed { i, e ->
                      val p = profiles[i]
                      val findings = mutableListOf<String>()
                      val recs = mutableListOf<String>()
                      var score = when (p.kind) {
                          SecurityKind.OPEN -> 90
                          SecurityKind.WEP -> 100
                          SecurityKind.WPA -> 80
                          SecurityKind.WPA_WPA2 -> 55
                          SecurityKind.OWE -> 30
                          SecurityKind.WPA2 -> if (p.enterprise) 10 else 20
                          SecurityKind.WPA2_WPA3 -> 15
                          SecurityKind.WPA3 -> 5
                          SecurityKind.UNKNOWN -> 40
                      }

                      when (p.kind) {
                          SecurityKind.OPEN -> {
                              findings += "Rede aberta: o tráfego trafega sem criptografia e pode ser observado por terceiros."
                              recs += "Habilite WPA3-Personal (ou WPA2-AES) com senha forte; em redes públicas, use VPN."
                          }
                          SecurityKind.WEP -> {
                              findings += "WEP é um protocolo obsoleto e considerado quebrado."
                              recs += "Substitua imediatamente por WPA3 ou WPA2-AES; se o roteador não suporta, troque o equipamento."
                          }
                          SecurityKind.WPA -> {
                              findings += "WPA (original) com TKIP é obsoleto e vulnerável."
                              recs += "Migre para WPA2-AES ou WPA3."
                          }
                          SecurityKind.WPA_WPA2 -> {
                              findings += "Modo misto WPA/WPA2 mantém compatibilidade com o WPA legado, mais fraco."
                              recs += "Desative o WPA legado e use somente WPA2-AES ou WPA3."
                          }
                          SecurityKind.OWE -> {
                              findings += "OWE criptografa o tráfego, mas não autentica a rede nem os usuários."
                              recs += "Para uso corporativo/privado, prefira WPA3-Personal ou Enterprise."
                          }
                          SecurityKind.WPA2 -> if (!p.enterprise) {
                              recs += "WPA2-AES é aceitável; se o roteador e os dispositivos suportarem, migre para WPA3."
                          }
                          SecurityKind.WPA2_WPA3 -> {
                              findings += "Modo de transição WPA2/WPA3: clientes antigos ainda podem usar WPA2."
                              recs += "Quando todos os dispositivos suportarem, use WPA3 exclusivo."
                          }
                          SecurityKind.WPA3 -> findings += "WPA3 em uso: configuração moderna."
                          SecurityKind.UNKNOWN -> {
                              findings += "Não foi possível identificar o tipo de segurança anunciado."
                          }
                      }
                      if (p.tkip && p.kind != SecurityKind.WPA && p.kind != SecurityKind.OPEN) {
                          score += 15
                          findings += "TKIP habilitado (cifra legada)."
                          recs += "Configure a cifra como AES/CCMP apenas."
                      }
                      if (p.wps) {
                          score += 15
                          findings += "WPS anunciado: o recurso de PIN/botão amplia a superfície de ataque."
                          recs += "Desative o WPS no roteador."
                      }
                      if (e.ssid.isBlank()) {
                          findings += "SSID oculto: não é uma medida de segurança real e pode causar problemas de conexão."
                          recs += "Mantenha o SSID visível e invista em criptografia e senha fortes."
                      }

                      // Mesmo nome com configurações de segurança diferentes.
                      if (e.ssid.isNotBlank()) {
                          val sameName = sorted.indices.filter { sorted[it].ssid == e.ssid && it != i }
                          if (sameName.any { profiles[it].kind != p.kind }) {
                              score += 10
                              findings += "Outro ponto de acesso usa o mesmo nome com segurança diferente " +
                                  "(possível rede duplicada/não autorizada ou configuração inconsistente)."
                              recs += "Confirme se todos os pontos de acesso com este nome são seus e usam a mesma configuração."
                          }
                      }

                      // Canal e sinal
                      val ch = channelOf(e.frequencyMhz)
                      val band = bandOf(e.frequencyMhz)
                      if (band == "2,4 GHz") {
                          val overlap = sorted.count {
                              it !== e && bandOf(it.frequencyMhz) == "2,4 GHz" &&
                                  abs(channelOf(it.frequencyMhz) - ch) <= 4
                          }
                          if (overlap >= 5) {
                              findings += "Canal $ch congestionado: $overlap redes com sobreposição (desempenho, não segurança)."
                              recs += "Mude para os canais 1, 6 ou 11, ou use a faixa de 5 GHz."
                          } else if (ch !in listOf(1, 6, 11) && ch in 1..13) {
                              findings += "Canal $ch fora do padrão 1/6/11 aumenta a interferência."
                          }
                      } else {
                          val same = sorted.count {
                              it !== e && bandOf(it.frequencyMhz) == band && channelOf(it.frequencyMhz) == ch
                          }
                          if (same >= 4) {
                              findings += "Canal $ch compartilhado com $same outras redes."
                              recs += "Escolha um canal menos utilizado."
                          }
                      }
                      if (e.levelDbm <= -80) {
                          findings += "Sinal fraco (${e.levelDbm} dBm): conexão instável."
                      }

                      score = score.coerceIn(0, 100)
                      val risk = when {
                          score >= 80 -> RiskLevel.CRITICAL
                          score >= 55 -> RiskLevel.HIGH
                          score >= 25 -> RiskLevel.MEDIUM
                          else -> RiskLevel.LOW
                      }
                      if (recs.isEmpty()) recs += "Mantenha o firmware do roteador atualizado e use senha forte e única."

                      AuditedNetwork(e, ch, band, p, score, risk, findings, recs.distinct())
                  }
              }
          }
          PROJ_EOF
          mkdir -p app/src/main/java/br/com/argos26/wifipasswordrecovery
