          package br.com.argos26.wifipasswordrecovery

          import android.graphics.Color

          enum class RiskLevel(val label: String, val color: Int) {
              LOW("Baixo", Color.parseColor("#1E9E5A")),
              MEDIUM("Médio", Color.parseColor("#D49A00")),
              HIGH("Alto", Color.parseColor("#F28C1B")),
              CRITICAL("Crítico", Color.parseColor("#D93636"))
          }

          enum class SecurityKind { OPEN, OWE, WEP, WPA, WPA_WPA2, WPA2, WPA2_WPA3, WPA3, UNKNOWN }

          /** Dados brutos de um ponto de acesso, desacoplados da API Android. */
          data class ScanEntry(
              val ssid: String,
              val bssid: String,
              val capabilities: String,
              val frequencyMhz: Int,
              val levelDbm: Int
          )

          data class SecurityProfile(
              val kind: SecurityKind,
              val enterprise: Boolean,
              val tkip: Boolean,
              val wps: Boolean,
              val label: String
          )

          data class AuditedNetwork(
              val entry: ScanEntry,
              val channel: Int,
              val band: String,
              val security: SecurityProfile,
              val score: Int,
              val risk: RiskLevel,
              val findings: List<String>,
              val recommendations: List<String>
          ) {
              val displaySsid: String get() = entry.ssid.ifBlank { "(SSID oculto)" }
              val signalPercent: Int get() = (2 * (entry.levelDbm + 100)).coerceIn(0, 100)
          }

          data class PasswordResult(
              val length: Int,
              val entropyBits: Int,
              val score: Int,
              val label: String,
              val level: RiskLevel,
              val crackTime: String,
              val validForWpa: Boolean,
              val issues: List<String>,
              val tips: List<String>
          )
