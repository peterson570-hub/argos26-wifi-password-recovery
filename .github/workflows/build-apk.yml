name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Criar arquivos do projeto
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'PROJ_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.com.argos26.wifipasswordrecovery"
              compileSdk = 35

              defaultConfig {
                  applicationId = "br.com.argos26.wifipasswordrecovery"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // Assinado com a chave debug para que o APK release seja instalável direto.
                      // Para publicação na Play Store, troque por um keystore próprio.
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              lint { abortOnError = false }
          }

          // Sem dependências externas de propósito: o app usa apenas o framework Android
          // (+ stdlib Kotlin, adicionada automaticamente), o que reduz superfície de falha
          // de build e de supply-chain.
          dependencies { }
          PROJ_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'PROJ_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.wifi" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Wi-Fi Password Recovery"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PROJ_EOF
          mkdir -p app/src/main/java/br/com/argos26/wifipasswordrecovery
          cat > app/src/main/java/br/com/argos26/wifipasswordrecovery/MainActivity.kt <<'PROJ_EOF'
          package br.com.argos26.wifipasswordrecovery

          import android.Manifest
          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.wifi.WifiManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import java.net.Inet4Address
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowInsets
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          @Suppress("DEPRECATION")
          class MainActivity : Activity() {

              private lateinit var wifi: WifiManager
              private lateinit var contentFrame: FrameLayout
              private val navItems = mutableListOf<TextView>()
              private var currentTab = 0

              private var networks: List<AuditedNetwork> = emptyList()
              private var scanTimeMs = 0L
              private var passwordResult: PasswordResult? = null

              private var scanStatus: TextView? = null
              private var scanList: LinearLayout? = null
              private var pwInput: EditText? = null

              private var receiverRegistered = false
              private val handler = Handler(Looper.getMainLooper())
              private var timeoutRunnable: Runnable? = null

              private val scanReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == WifiManager.SCAN_RESULTS_AVAILABLE_ACTION) {
                          cancelTimeout()
                          loadResults()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  wifi = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  window.statusBarColor = Brand.NAVY
                  window.navigationBarColor = Brand.NAVY
                  setContentView(buildRoot())
                  showTab(0)
              }

              // ---------- Estrutura ----------

              private fun buildRoot(): View {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Brand.NAVY)
                  root.setOnApplyWindowInsetsListener { v, insets ->
                      if (Build.VERSION.SDK_INT >= 30) {
                          val bars = insets.getInsets(WindowInsets.Type.systemBars())
                          v.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                      } else {
                          v.setPadding(
                              insets.systemWindowInsetLeft, insets.systemWindowInsetTop,
                              insets.systemWindowInsetRight, insets.systemWindowInsetBottom
                          )
                      }
                      insets
                  }

                  // Cabeçalho
                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.VERTICAL
                  header.setBackgroundColor(Brand.NAVY)
                  header.setPadding(dp(20), dp(14), dp(20), dp(12))
                  header.addView(tv("EQUIPE ARGOS26", 12f, Brand.YELLOW, true))
                  header.addView(tv("Wi-Fi Password Recovery", 22f, Brand.WHITE, true))
                  root.addView(header, lp())
                  val stripe = View(this)
                  stripe.setBackgroundColor(Brand.YELLOW)
                  root.addView(stripe, LinearLayout.LayoutParams(MATCH, dp(3)))

                  // Conteúdo
                  contentFrame = FrameLayout(this)
                  contentFrame.setBackgroundColor(Brand.BG)
                  root.addView(contentFrame, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  // Navegação inferior
                  val nav = LinearLayout(this)
                  nav.orientation = LinearLayout.HORIZONTAL
                  nav.setBackgroundColor(Brand.NAVY_SOFT)
                  listOf("Scanner", "Senhas", "Laboratório", "Relatório").forEachIndexed { index, label ->
                      val item = tv(label, 14f, Brand.WHITE, true)
                      item.gravity = Gravity.CENTER
                      item.setPadding(0, dp(14), 0, dp(14))
                      item.setOnClickListener { showTab(index) }
                      navItems.add(item)
                      nav.addView(item, LinearLayout.LayoutParams(0, WRAP, 1f))
                  }
                  root.addView(nav, lp())
                  return root
              }

              private fun showTab(index: Int) {
                  currentTab = index
                  contentFrame.removeAllViews()
                  scanStatus = null; scanList = null; pwInput = null
                  val view = when (index) {
                      0 -> buildScannerTab()
                      1 -> buildPasswordTab()
                      2 -> buildLabTab()
                      else -> buildReportTab()
                  }
                  contentFrame.addView(view)
                  navItems.forEachIndexed { i, item ->
                      val selected = i == index
                      item.setTextColor(if (selected) Brand.YELLOW else Color.argb(170, 255, 255, 255))
                      item.setBackgroundColor(if (selected) Brand.NAVY else Color.TRANSPARENT)
                  }
              }

              private fun page(vararg children: View): ScrollView {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(16), dp(16), dp(16), dp(24))
                  children.forEach { col.addView(it) }
                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  sv.addView(col)
                  return sv
              }

              private fun bulletList(items: List<String>, color: Int = Brand.TEXT): TextView =
                  tv(items.joinToString("\n") { "• $it" }, 13f, color)

              // ---------- Aba Scanner ----------

              private fun buildScannerTab(): View {
                  val intro = card()
                  intro.addView(tv("Scanner Wi-Fi", 20f, Brand.NAVY, true))
                  intro.addView(
                      tv(
                          "Lê apenas as informações que as redes próximas já transmitem (SSID, BSSID, " +
                              "criptografia, canal e sinal). O app não conecta, não captura tráfego e " +
                              "não tenta descobrir senhas de redes.",
                          13f, Brand.MUTED
                      ), lp(t = 6)
                  )
                  val scanBtn = actionButton("ESCANEAR REDES PRÓXIMAS") { requestPermissionAndScan() }
                  intro.addView(scanBtn, lp(t = 14))
                  val settingsBtn = actionButton("Abrir configurações de localização", false) {
                      startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS))
                  }
                  intro.addView(settingsBtn, lp(t = 8))

                  val connectionCard = card()
                  connectionCard.addView(tv("Comprovação de conexão", 17f, Brand.NAVY, true))
                  connectionCard.addView(
                      tv(
                          "Depois de conectar o celular a uma rede Wi-Fi, verifique aqui o estado da conexão e o IP local recebido pelo aparelho.",
                          12f, Brand.MUTED
                      ), lp(t = 5)
                  )
                  val connectionResult = tv("Conexão ainda não verificada.", 14f, Brand.NAVY, true)
                  connectionCard.addView(connectionResult, lp(t = 8))
                  connectionCard.addView(
                      actionButton("VERIFICAR ACESSO E ENDEREÇO IP") {
                          verifyWifiConnection(connectionResult)
                      }, lp(t = 10)
                  )

                  val status = tv(
                      if (networks.isEmpty()) "Toque em Escanear para iniciar."
                      else "Redes encontradas: ${networks.size}", 14f, Brand.NAVY, true
                  )
                  scanStatus = status
                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  scanList = list
                  populateNetworkList()

                  val note = tv(
                      "O Android limita a frequência de varreduras e exige permissão de localização " +
                          "com a localização do aparelho ativada. Alguns fabricantes restringem os resultados.",
                      12f, Brand.MUTED
                  )
                  val sv = page(intro)
                  val col = sv.getChildAt(0) as LinearLayout
                  col.addView(connectionCard, lp(t = 12))
                  col.addView(status, lp(t = 16, b = 8))
                  col.addView(list, lp())
                  col.addView(note, lp(t = 12))
                  return sv
              }

              private fun verifyWifiConnection(output: TextView) {
                  try {
                      val connectivity = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val active = connectivity.activeNetwork
                      if (active == null) {
                          output.text = "SEM CONEXÃO WI-FI ATIVA\\nConecte-se à rede e verifique novamente."
                          return
                      }

                      val capabilities = connectivity.getNetworkCapabilities(active)
                      if (capabilities == null || !capabilities.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                          output.text = "O aparelho não está usando uma conexão Wi-Fi ativa."
                          return
                      }

                      val properties = connectivity.getLinkProperties(active)
                      val addresses = properties?.linkAddresses?.map { it.address } ?: emptyList()
                      val ipv4 = addresses.firstOrNull {
                          it is Inet4Address && !it.isLoopbackAddress && !it.isLinkLocalAddress
                      }
                      val ipv6 = addresses.firstOrNull {
                          it !is Inet4Address && !it.isLoopbackAddress && !it.isLinkLocalAddress
                      }
                      val ip = ipv4?.hostAddress ?: ipv6?.hostAddress

                      if (ip == null) {
                          output.text = "WI-FI CONECTADO, MAS SEM IP LOCAL VÁLIDO\\n" +
                              "O aparelho ainda não apresenta um endereço IP utilizável nessa conexão."
                          return
                      }

                      val internetValidated = capabilities.hasCapability(
                          NetworkCapabilities.NET_CAPABILITY_VALIDATED
                      )
                      output.text = "CONEXÃO WI-FI ATIVA\\n" +
                          "IP local: $ip\\n" +
                          "Internet validada: ${if (internetValidated) "sim" else "não / rede sem validação externa"}\\n" +
                          "Verificação feita pelo Android. O endereço IP confirma a configuração de rede, " +
                          "mas não identifica por si só como a autenticação foi realizada."
                  } catch (e: SecurityException) {
                      output.text = "O Android bloqueou a leitura do estado da conexão."
                  } catch (e: Exception) {
                      output.text = "Não foi possível consultar a conexão: ${e.message ?: "erro desconhecido"}"
                  }
              }

              private fun populateNetworkList() {
                  val list = scanList ?: return
                  list.removeAllViews()
                  networks.forEach { list.addView(networkCard(it), lp(b = 12)) }
              }

              private fun networkCard(n: AuditedNetwork): View {
                  val c = card()
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.addView(tv(n.displaySsid, 17f, Brand.NAVY, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  top.addView(pill("Risco ${n.risk.label}", n.risk.color))
                  c.addView(top)

                  val ch = if (n.channel > 0) "${n.channel}" else "?"
                  c.addView(tv("BSSID: ${n.entry.bssid}", 12f, Brand.MUTED), lp(t = 6))
                  c.addView(tv("Segurança: ${n.security.label}", 14f), lp(t = 4))
                  c.addView(tv("Canal: $ch  •  ${n.band}  •  ${n.entry.frequencyMhz} MHz", 14f), lp(t = 2))
                  c.addView(tv("Sinal: ${n.entry.levelDbm} dBm (${n.signalPercent}%)", 14f), lp(t = 2))

                  val bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 100
                  bar.progress = n.signalPercent
                  bar.progressTintList = ColorStateList.valueOf(Brand.BLUE)
                  c.addView(bar, lp(h = dp(8), t = 6))

                  val details = LinearLayout(this)
                  details.orientation = LinearLayout.VERTICAL
                  details.visibility = View.GONE
                  details.addView(tv("Achados", 13f, Brand.NAVY, true), lp(t = 10))
                  details.addView(bulletList(n.findings.ifEmpty { listOf("Nenhum achado relevante.") }))
                  details.addView(tv("Recomendações", 13f, Brand.NAVY, true), lp(t = 8))
                  details.addView(bulletList(n.recommendations))
                  c.addView(details)

                  val hint = tv("Toque para ver detalhes ▾", 12f, Brand.BLUE, true)
                  c.addView(hint, lp(t = 8))
                  c.setOnClickListener {
                      val open = details.visibility == View.VISIBLE
                      details.visibility = if (open) View.GONE else View.VISIBLE
                      hint.text = if (open) "Toque para ver detalhes ▾" else "Ocultar detalhes ▴"
                  }
                  return c
              }

              private fun requestPermissionAndScan() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), REQ_LOCATION)
                      return
                  }
                  startWifiScan()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode != REQ_LOCATION) return
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startWifiScan()
                  } else {
                      scanStatus?.text = "Permissão não concedida. O Android exige localização para exibir redes Wi-Fi."
                  }
              }

              private fun startWifiScan() {
                  if (!wifi.isWifiEnabled) {
                      scanStatus?.text = "O Wi-Fi está desligado. Ligue o Wi-Fi e tente novamente."
                      return
                  }
                  if (!receiverRegistered) {
                      val filter = IntentFilter(WifiManager.SCAN_RESULTS_AVAILABLE_ACTION)
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(scanReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                      } else {
                          registerReceiver(scanReceiver, filter)
                      }
                      receiverRegistered = true
                  }
                  scanStatus?.text = "Escaneando redes próximas..."
                  val started = wifi.startScan()
                  if (!started) {
                      scanStatus?.text = "O Android limitou uma nova varredura. Mostrando os últimos resultados."
                      loadResults()
                  } else {
                      cancelTimeout()
                      val r = Runnable { loadResults() }
                      timeoutRunnable = r
                      handler.postDelayed(r, 10_000)
                  }
              }

              private fun cancelTimeout() {
                  timeoutRunnable?.let { handler.removeCallbacks(it) }
                  timeoutRunnable = null
              }

              @Suppress("DEPRECATION", "MissingPermission")
              private fun loadResults() {
                  val raw = try {
                      wifi.scanResults
                  } catch (e: SecurityException) {
                      scanStatus?.text = "Sem permissão para ler os resultados Wi-Fi."
                      return
                  }
                  if (raw.isNullOrEmpty()) {
                      scanStatus?.text = "Nenhuma rede retornada. Verifique a localização do aparelho e tente de novo."
                      return
                  }
                  val entries = raw.map {
                      ScanEntry(it.SSID ?: "", it.BSSID ?: "", it.capabilities ?: "", it.frequency, it.level)
                  }
                  networks = SecurityAnalyzer.audit(entries)
                  scanTimeMs = System.currentTimeMillis()
                  scanStatus?.text = "Redes encontradas: ${networks.size}"
                  populateNetworkList()
              }

              // ---------- Aba Senhas ----------

              private fun buildPasswordTab(): View {
                  val c = card()
                  c.addView(tv("Análise local de senha", 20f, Brand.NAVY, true))
                  c.addView(
                      tv(
                          "Recuperação por QR Code e experimentos Dictionary/Random em laboratório. " +
                              "O Android não permite que um app comum leia a senha de qualquer rede próxima. " +
                              "A demonstração de busca é offline e não tenta autenticar em redes Wi-Fi.",
                          13f, Brand.MUTED
                      ), lp(t = 6)
                  )

                  val owner = CheckBox(this)
                  owner.text = "Declaro que sou o proprietário/autorizado desta rede"
                  owner.textSize = 13f
                  owner.setTextColor(Brand.TEXT)
                  c.addView(owner, lp(t = 10))

                  val input = EditText(this)
                  input.hint = "Senha para análise de força"
                  input.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  input.setSingleLine()
                  pwInput = input
                  c.addView(input, lp(t = 6))

                  val show = CheckBox(this)
                  show.text = "Mostrar senha"
                  show.textSize = 13f
                  show.setTextColor(Brand.TEXT)
                  show.setOnCheckedChangeListener { _, checked ->
                      val type = if (checked) InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD
                      else InputType.TYPE_TEXT_VARIATION_PASSWORD
                      input.inputType = InputType.TYPE_CLASS_TEXT or type
                      input.setSelection(input.text.length)
                  }
                  c.addView(show)

                  val resultBox = LinearLayout(this)
                  resultBox.orientation = LinearLayout.VERTICAL

                  c.addView(actionButton("ANALISAR FORÇA DA SENHA") {
                      if (!owner.isChecked) {
                          Toast.makeText(this, "Confirme que a rede é sua ou que você está autorizado.", Toast.LENGTH_LONG).show()
                      } else if (input.text.isNullOrEmpty()) {
                          Toast.makeText(this, "Digite uma senha para analisar.", Toast.LENGTH_SHORT).show()
                      } else {
                          val r = PasswordAnalyzer.analyze(input.text.toString())
                          passwordResult = r
                          renderPasswordResult(resultBox, r)
                      }
                  }, lp(t = 10))
                  c.addView(resultBox, lp(t = 12))
                  passwordResult?.let { renderPasswordResult(resultBox, it) }

                  val lab = card()
                  lab.addView(tv("Uso responsável", 15f, Brand.NAVY, true))
                  lab.addView(
                      tv(
                          "Dictionary e Random demonstram conceitos de busca offline usando uma senha de referência " +
                              "fornecida pelo aluno. O resultado não comprova acesso à rede nem substitui " +
                              "um teste real de autenticação.", 13f, Brand.MUTED
                      ), lp(t = 4)
                  )
                  val sv = page(c)
                  (sv.getChildAt(0) as LinearLayout).addView(lab, lp(t = 12))
                  return sv
              }

              private fun renderPasswordResult(box: LinearLayout, r: PasswordResult) {
                  box.removeAllViews()
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.addView(tv("Força: ${r.label}", 17f, Brand.NAVY, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(pill("${r.score}/100", r.level.color))
                  box.addView(row)
                  val bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 100
                  bar.progress = r.score
                  bar.progressTintList = ColorStateList.valueOf(r.level.color)
                  box.addView(bar, lp(h = dp(8), t = 8))
                  box.addView(
                      tv(
                          "Tamanho: ${r.length} caracteres\nEntropia estimada: ~${r.entropyBits} bits\n" +
                              "Tempo teórico de quebra offline: ${r.crackTime}\n" +
                              "Válida para WPA2/WPA3 (8–63): ${if (r.validForWpa) "sim" else "não"}", 13f
                      ), lp(t = 8)
                  )
                  if (r.issues.isNotEmpty()) {
                      box.addView(tv("Problemas", 13f, Brand.NAVY, true), lp(t = 8))
                      box.addView(bulletList(r.issues))
                  }
                  box.addView(tv("Recomendações", 13f, Brand.NAVY, true), lp(t = 8))
                  box.addView(bulletList(r.tips))
                  box.addView(
                      tv("Estimativa teórica; não é garantia de segurança.", 11f, Brand.MUTED), lp(t = 6)
                  )
              }

              // ---------- Laboratório offline Dictionary / Random ----------

              private fun buildLabTab(): View {
                  val c = card()
                  c.addView(tv("Laboratório de busca offline", 20f, Brand.NAVY, true))
                  c.addView(tv(
                      "Demonstração acadêmica: compara candidatos localmente com uma referência informada para o experimento. Não se conecta ao roteador nem testa redes reais.",
                      13f, Brand.MUTED
                  ), lp(t = 6))

                  val consent = CheckBox(this)
                  consent.text = "Confirmo que a referência foi fornecida para este experimento"
                  consent.textSize = 13f
                  consent.setTextColor(Brand.TEXT)
                  c.addView(consent, lp(t = 10))

                  val reference = EditText(this)
                  reference.hint = "Referência do laboratório (3 dígitos para Random)"
                  reference.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  reference.setSingleLine()
                  c.addView(reference, lp(t = 6))

                  val candidates = EditText(this)
                  candidates.hint = "Dictionary: um candidato por linha"
                  candidates.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                  candidates.minLines = 4
                  candidates.gravity = Gravity.TOP
                  c.addView(candidates, lp(t = 8))

                  val progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  progress.max = 100
                  progress.progress = 0
                  progress.progressTintList = ColorStateList.valueOf(Brand.BLUE)
                  c.addView(progress, lp(h = dp(8), t = 12))

                  val result = tv("Pronto para executar o experimento.", 14f, Brand.NAVY, true)
                  c.addView(result, lp(t = 10))

                  val runButton = actionButton("EXECUTAR DICTIONARY + RANDOM", true) {
                      val secret = reference.text.toString()
                      val dictionary = candidates.text.toString().lines()
                          .map { it.trim() }.filter { it.isNotEmpty() }.distinct()

                      when {
                          !consent.isChecked -> Toast.makeText(
                              this, "Confirme o uso da referência do laboratório.", Toast.LENGTH_LONG
                          ).show()
                          secret.isEmpty() -> result.text = "Informe a referência do experimento."
                          else -> {
                              // Dictionary percorre os itens digitados. Se não houver
                              // correspondência e a referência tiver 3 dígitos, Random
                              // percorre 000..999 em ordem aleatória. Tudo é local/offline.
                              val dictionarySequence = dictionary.map { Pair("Dictionary", it) }
                              val randomSequence = if (
                                  secret.length == 3 && secret.all { it.isDigit() }
                              ) {
                                  (0..999).map { Pair("Random", "%03d".format(it)) }.shuffled()
                              } else {
                                  emptyList()
                              }
                              val sequence = dictionarySequence + randomSequence
                              progress.progress = 0
                              result.text = "Executando comparação offline…"
                              var index = 0
                              var finished = false

                              fun nextCandidate() {
                                  if (finished) return
                                  if (index >= sequence.size) {
                                      finished = true
                                      result.text = "NENHUMA CORRESPONDÊNCIA NESTA EXECUÇÃO\n" +
                                          "Candidatos verificados: " + sequence.size + "\n" +
                                          (if (randomSequence.isEmpty())
                                              "Random não executado: informe uma referência numérica de 3 dígitos para esse modo.\n"
                                          else "Dictionary e Random concluídos.\n") +
                                          "Nenhuma rede Wi-Fi foi acessada."
                                      return
                                  }

                                  val pair = sequence[index]
                                  val method = pair.first
                                  val candidate = pair.second
                                  index += 1
                                  progress.progress = (index * 100 / sequence.size).coerceIn(0, 100)
                                  if (candidate == secret) {
                                      finished = true
                                      result.text = "SENHA ENCONTRADA NO LABORATÓRIO\n" +
                                          "Correspondência da referência: " + candidate + "\n" +
                                          "Método: " + method + "\n" +
                                          "Candidatos verificados: " + index + "\n" +
                                          "Resultado de comparação offline; não é uma senha obtida do Wi-Fi."
                                  } else {
                                      handler.postDelayed({ nextCandidate() }, 8)
                                  }
                              }
                              if (sequence.isEmpty()) {
                                  result.text = "Informe ao menos um candidato no Dictionary ou use uma referência numérica de 3 dígitos para Random."
                              } else {
                                  nextCandidate()
                              }
                          }
                      }
                  }
                  c.addView(runButton, lp(t = 12))

                  val note = card()
                  note.addView(tv("Como funcionam os dois métodos", 14f, Brand.NAVY, true))
                  note.addView(tv(
                      "Dictionary: compara a referência com cada linha informada. Random: se a referência tiver exatamente 3 dígitos, testa as combinações de 000 a 999 em ordem aleatória. O modo é limitado e serve apenas para demonstrar busca offline; não testa autenticação nem descobre senhas de redes.",
                      12f, Brand.MUTED
                  ), lp(t = 4))
                  val sv = page(c)
                  (sv.getChildAt(0) as LinearLayout).addView(note, lp(t = 12))
                  return sv
              }

              // ---------- Aba Relatório ----------

              private fun buildReportTab(): View {
                  if (networks.isEmpty()) {
                      val c = card()
                      c.addView(tv("Relatório do experimento", 20f, Brand.NAVY, true))
                      c.addView(tv("Faça um escaneamento na aba Scanner para gerar o relatório.", 14f, Brand.MUTED), lp(t = 6))
                      return page(c)
                  }
                  val summary = card()
                  summary.addView(tv("Resumo executivo", 20f, Brand.NAVY, true))
                  summary.addView(tv("${networks.size} redes analisadas", 14f, Brand.MUTED), lp(t = 2))
                  val pills = LinearLayout(this)
                  pills.orientation = LinearLayout.HORIZONTAL
                  RiskLevel.values().reversed().forEach { lvl ->
                      val count = networks.count { it.risk == lvl }
                      pills.addView(pill("${lvl.label}: $count", lvl.color), lp(r = 6))
                  }
                  summary.addView(pills, lp(t = 10))

                  val report = ReportBuilder.build(networks, scanTimeMs, passwordResult)
                  val body = card()
                  val text = tv(report, 11f)
                  text.typeface = Typeface.MONOSPACE
                  text.setTextIsSelectable(true)
                  body.addView(text)

                  val share = actionButton("COMPARTILHAR RELATÓRIO") {
                      val send = Intent(Intent.ACTION_SEND)
                      send.type = "text/plain"
                      send.putExtra(Intent.EXTRA_SUBJECT, "Relatório Wi-Fi — EQUIPE ARGOS26")
                      send.putExtra(Intent.EXTRA_TEXT, report)
                      startActivity(Intent.createChooser(send, "Compartilhar relatório"))
                  }
                  val sv = page(summary)
                  val col = sv.getChildAt(0) as LinearLayout
                  col.addView(share, lp(t = 12))
                  col.addView(body, lp(t = 12))
                  return sv
              }

              // ---------- Ciclo de vida ----------

              override fun onStop() {
                  // Privacidade: não deixa a senha digitada na tela ao sair do app.
                  pwInput?.setText("")
                  super.onStop()
              }

              override fun onDestroy() {
                  cancelTimeout()
                  if (receiverRegistered) {
                      try { unregisterReceiver(scanReceiver) } catch (_: Exception) {}
                      receiverRegistered = false
                  }
                  super.onDestroy()
              }

              companion object {
                  private const val REQ_LOCATION = 501
              }
          }
