          package br.com.argos26.wifipasswordrecovery

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          object Brand {
              val NAVY = Color.parseColor("#0B1F3A")
              val NAVY_SOFT = Color.parseColor("#14305A")
              val BLUE = Color.parseColor("#1E6FD9")
              val YELLOW = Color.parseColor("#FFC400")
              val BG = Color.parseColor("#F3F6FB")
              val TEXT = Color.parseColor("#0B1F3A")
              val MUTED = Color.parseColor("#5B6B82")
              val WHITE = Color.WHITE
          }

          const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()

          fun roundedBg(color: Int, radiusPx: Float): GradientDrawable =
              GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = radiusPx
              }

          fun Context.lp(
              w: Int = MATCH, h: Int = WRAP,
              l: Int = 0, t: Int = 0, r: Int = 0, b: Int = 0
          ): LinearLayout.LayoutParams =
              LinearLayout.LayoutParams(w, h).also { it.setMargins(dp(l), dp(t), dp(r), dp(b)) }

          fun Context.tv(
              content: CharSequence,
              size: Float = 14f,
              color: Int = Brand.TEXT,
              bold: Boolean = false
          ): TextView {
              val view = TextView(this)
              view.text = content
              view.textSize = size
              view.setTextColor(color)
              if (bold) view.setTypeface(view.typeface, Typeface.BOLD)
              return view
          }

          fun Context.card(): LinearLayout {
              val c = LinearLayout(this)
              c.orientation = LinearLayout.VERTICAL
              c.background = roundedBg(Brand.WHITE, dp(16).toFloat())
              c.setPadding(dp(16), dp(16), dp(16), dp(16))
              c.elevation = dp(2).toFloat()
              return c
          }

          fun Context.actionButton(label: String, primary: Boolean = true, onClick: () -> Unit): Button {
              val b = Button(this)
              b.text = label
              b.isAllCaps = false
              b.textSize = 15f
              b.setTypeface(b.typeface, Typeface.BOLD)
              b.setTextColor(if (primary) Brand.NAVY else Brand.WHITE)
              b.background = roundedBg(if (primary) Brand.YELLOW else Brand.BLUE, dp(12).toFloat())
              b.stateListAnimator = null
              b.minimumHeight = dp(52)
              b.setOnClickListener { onClick() }
              return b
          }

          fun Context.pill(label: String, color: Int): TextView {
              val p = tv(label, 12f, Color.WHITE, true)
              p.setPadding(dp(10), dp(4), dp(10), dp(4))
              p.background = roundedBg(color, dp(20).toFloat())
              return p
          }
