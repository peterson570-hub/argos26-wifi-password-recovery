          package br.com.argos26.wifipasswordrecovery

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object ReportBuilder {

              fun build(networks: List<AuditedNetwork>, scanTimeMs: Long, password: PasswordResult?): String {
                  val fmt = SimpleDateFormat("dd/MM/yyyy HH:mm", Locale("pt", "BR"))
                  val sb = StringBuilder()
                  val line = "=".repeat(40)

                  sb.appendLine(line)
                  sb.appendLine("EQUIPE ARGOS26")
                  sb.appendLine("RELATÓRIO DE SEGURANÇA WI-FI")
                  sb.appendLine(line)
                  sb.appendLine("Data da varredura: ${fmt.format(Date(scanTimeMs))}")
                  sb.appendLine("Emitido em: ${fmt.format(Date())}")
                  sb.appendLine("Método: varredura passiva (somente beacons públicos)")
                  sb.appendLine()

                  sb.appendLine("1. RESUMO EXECUTIVO")
                  sb.appendLine("-".repeat(40))
                  if (networks.isEmpty()) {
                      sb.appendLine("Nenhuma rede foi analisada.")
                  } else {
                      sb.appendLine("Redes analisadas: ${networks.size}")
                      RiskLevel.values().reversed().forEach { lvl ->
                          sb.appendLine("  • Risco ${lvl.label}: ${networks.count { it.risk == lvl }}")
                      }
                      val worst = networks.maxByOrNull { it.score }
                      if (worst != null) {
                          sb.appendLine("Maior risco: ${worst.displaySsid} (${worst.security.label}, ${worst.risk.label})")
                      }
                  }
                  sb.appendLine()

                  sb.appendLine("2. REDES DETECTADAS")
                  sb.appendLine("-".repeat(40))
                  networks.forEachIndexed { i, n ->
                      sb.appendLine("${i + 1}. ${n.displaySsid}")
                      sb.appendLine("   BSSID: ${n.entry.bssid}")
                      sb.appendLine("   Segurança: ${n.security.label}")
                      val ch = if (n.channel > 0) n.channel.toString() else "?"
                      sb.appendLine("   Canal: $ch (${n.band}, ${n.entry.frequencyMhz} MHz)")
                      sb.appendLine("   Sinal: ${n.entry.levelDbm} dBm (${n.signalPercent}%)")
                      sb.appendLine("   Risco: ${n.risk.label} (pontuação ${n.score}/100)")
                      n.findings.forEach { sb.appendLine("   - Achado: $it") }
                      n.recommendations.forEach { sb.appendLine("   - Ação: $it") }
                      sb.appendLine()
                  }

                  sb.appendLine("3. ANÁLISE DE SENHA (LOCAL)")
                  sb.appendLine("-".repeat(40))
                  if (password == null) {
                      sb.appendLine("Nenhuma senha foi analisada nesta sessão.")
                  } else {
                      sb.appendLine("A senha em si NÃO é registrada neste relatório.")
                      sb.appendLine("Tamanho: ${password.length} caracteres")
                      sb.appendLine("Classificação: ${password.label} (${password.score}/100)")
                      sb.appendLine("Entropia estimada: ~${password.entropyBits} bits")
                      sb.appendLine("Tempo teórico de quebra offline: ${password.crackTime}")
                      sb.appendLine("Válida para WPA2/WPA3 (8–63): ${if (password.validForWpa) "sim" else "não"}")
                      password.issues.forEach { sb.appendLine("  - Problema: $it") }
                  }
                  sb.appendLine()

                  sb.appendLine("4. RECOMENDAÇÕES GERAIS")
                  sb.appendLine("-".repeat(40))
                  val general = mutableListOf(
                      "Use WPA3 (ou WPA2-AES) e senha única com 16+ caracteres.",
                      "Desative WPS e o acesso administrativo remoto do roteador.",
                      "Troque as credenciais de administração padrão do roteador.",
                      "Mantenha o firmware atualizado.",
                      "Separe visitantes e dispositivos IoT em uma rede de convidados."
                  )
                  if (networks.any { it.security.kind == SecurityKind.OPEN }) general += "Evite redes abertas ou use VPN."
                  if (networks.any { it.security.kind == SecurityKind.WEP || it.security.kind == SecurityKind.WPA }) {
                      general += "Substitua redes WEP/WPA legadas imediatamente."
                  }
                  general.forEach { sb.appendLine("  • $it") }
                  sb.appendLine()

                  sb.appendLine("5. ESCOPO E LIMITAÇÕES")
                  sb.appendLine("-".repeat(40))
                  sb.appendLine("• Avaliação passiva baseada apenas nas informações anunciadas pelas redes.")
                  sb.appendLine("• Não houve conexão, quebra de senha, força bruta ou captura de tráfego.")
                  sb.appendLine("• Testes ativos só devem ocorrer em laboratório com autorização formal.")
                  sb.appendLine("• A pontuação é uma heurística e não substitui um pentest autorizado.")
                  sb.appendLine("• O Android limita a frequência de varreduras e pode omitir redes.")
                  return sb.toString()
              }
          }
