          # Wi-Fi Password Recovery — EQUIPE ARGOS26

          Aplicativo Android acadêmico em Kotlin.

          ## Módulos
          - Scanner passivo de redes próximas e classificação básica de segurança.
          - Análise local da força de uma senha digitada pelo usuário.
          - Laboratório offline Dictionary/Random: Dictionary compara palavras informadas; Random testa combinações numéricas de 3 dígitos em ordem aleatória quando a referência tem esse formato. Não autentica no roteador e não recupera senhas de redes desconhecidas.
          - Relatório compartilhável.

          ## Compilação
          O GitHub Actions compila APK Debug e Release em **Actions > Build APK > Artifacts**.

          ## Limitação Android
          Aplicativos Android comuns não podem ler livremente senhas de redes próximas nem extrair credenciais de qualquer roteador. Para recuperar a senha da rede doméstica, use o QR Code de compartilhamento do Android ou o painel administrativo do roteador.
